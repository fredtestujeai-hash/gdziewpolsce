# Ten plik służy WYŁĄCZNIE do lokalnego uruchamiania rankingu (npx wrangler pages dev dist).
# Celowo nie ma tu „pages_build_output_dir”: dzięki temu Cloudflare Pages ignoruje ten plik,
# a ustawienia prawdziwego projektu (w tym podpięcie bazy jako „DB”) robi się w panelu Cloudflare.
# Opis wdrożenia: docs/CLOUDFLARE.md
name = "gdziewpolsce"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "gdziewpolsce-ranking"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
