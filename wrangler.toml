# Cloudflare Workers: gra (pliki statyczne z dist/) + ranking (worker/index.ts, baza D1).
# Cloudflare po każdym pushu do main wykonuje: npm run build, a potem npx wrangler deploy.
# Opis: docs/CLOUDFLARE.md
name = "gdziewpolsce"
main = "worker/index.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# Baza rankingu. Bez wpisanego identyfikatora: Cloudflare sam znajduje bazę o tej nazwie
# (albo ją tworzy), a tabele zakłada sam serwer przy pierwszym zapytaniu.
[[d1_databases]]
binding = "DB"
database_name = "gdziewpolsce-ranking"
