    <style>
      /* Animacja startowa: obrys Polski rysowany, zanim wczyta się reszta gry (kolory jak w src/style.css). */
      #intro {
        --i-bg: #f5efe4; --i-land: #fffcf6; --i-ink: #1e1b17; --i-muted: #6d665c; --i-accent: #c41e3a; --i-dot: #fff;
        position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 24px;
        background: var(--i-bg); color: var(--i-ink); transition: opacity .3s ease;
      }
      @media (prefers-color-scheme: dark) {
        #intro { --i-bg: #16181b; --i-land: #1f2226; --i-ink: #eee9e1; --i-muted: #a59e93; --i-accent: #ef5468; --i-dot: #1f2226; }
      }
      #intro.intro-out { opacity: 0; pointer-events: none; }
      .intro-box { width: min(72vw, 46vh, 340px); text-align: center; margin-bottom: 6vh; }
      .intro-map { display: block; width: 100%; height: auto; overflow: visible; }
      .intro-outline {
        fill: var(--i-land); fill-opacity: 0; stroke: var(--i-accent); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: intro-draw 1.3s cubic-bezier(.45, .05, .35, 1) .1s forwards, intro-fill .5s ease-out 1.25s forwards;
      }
      .intro-pin-body { fill: var(--i-accent); opacity: 0; animation: intro-drop .4s cubic-bezier(.3, 1.5, .5, 1) 1.35s forwards; }
      .intro-pin-body circle { fill: var(--i-dot); }
      .intro-ping { fill: none; stroke: var(--i-accent); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; animation: intro-ping 1.6s ease-out 1.7s infinite; }
      .intro-title {
        margin: 18px 0 0; font: 650 clamp(1.5rem, 6vw, 2rem)/1.15 "Fraunces Variable", Georgia, "Times New Roman", serif; letter-spacing: -.01em;
        opacity: 0; animation: intro-rise .45s ease-out 1.3s forwards;
      }
      .intro-note { margin: 10px 0 0; font: 400 .95rem/1.4 system-ui, sans-serif; color: var(--i-muted); }
      @keyframes intro-draw { to { stroke-dashoffset: 0; } }
      @keyframes intro-fill { to { fill-opacity: 1; } }
      @keyframes intro-drop { from { opacity: 0; transform: translateY(-70px); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
      @keyframes intro-ping { from { opacity: .7; transform: scale(.3); } 70%, to { opacity: 0; transform: scale(2.6); } }
      @keyframes intro-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #intro { transition: none; }
        .intro-outline { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
        .intro-pin-body, .intro-title { animation: none; opacity: 1; }
        .intro-ping { animation: none; }
      }
    </style>
  </head>

    <script>
      // Pinezka wbija się za każdym razem w inne miejsce (lista z scripts/build_intro.mjs)
      (function () {
        var pin = document.querySelector(".intro-pin");
        var spots = pin.getAttribute("data-spots").split(" ");
        pin.setAttribute("transform", "translate(" + spots[Math.floor(Math.random() * spots.length)].replace(",", " ") + ")");
      })();
    </script>
